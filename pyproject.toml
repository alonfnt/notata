[project]
name = "notata"
dynamic = ["version"]
description = "Structured filesystem logging for scientific runs: parameters, arrays, plots and metadata in plain files"
authors = [
    {name = "Albert Alonso", email = "alonfnt@pm.me"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = [
    "logging",
    "experiment-tracking",
    "reproducibility",
    "scientific-computing",
    "simulation",
    "parameter-sweep",
    "provenance",
    "research-data-management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
  "numpy",
  "pyyaml"
]

[tool.setuptools.dynamic]
version = {attr = "notata.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["notata*"]

[tool.setuptools.package-data]
notata = ["py.typed"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "matplotlib",
  "pandas",
  "pytest",
  "pytest-cov"
]

[project.urls]
Homepage = "https://github.com/alonfnt/notata"
Documentation = "https://notata.readthedocs.io"
Repository = "https://github.com/alonfnt/notata"
Issues = "https://github.com/alonfnt/notata/issues"
